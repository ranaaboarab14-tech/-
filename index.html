<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة النتائج ولجنة الرأفة</title>
<!-- Bootstrap 5 RTL -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<!-- Google Font: Cairo -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<!-- Custom CSS -->
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
<div class="container py-5">
<div class="text-center mb-5">
<h1 class="fw-bold text-primary">نظام إدارة النتائج الأكاديمية</h1>
<p class="text-muted">تسجيل درجات الطلاب وتفعيل معالجة لجنة الرأفة</p>
</div>
<div class="row g-4">
<!-- قسم إدخال البيانات -->
<div class="col-lg-5">
<div class="card shadow-sm border-0 rounded-3">
<div class="card-header bg-primary text-white fw-bold py-3">
                       إدخال بيانات الطالب
</div>
<div class="card-body p-4">
<!-- صندوق عرض رسائل الخطأ (فارغ في البداية) -->
<div id="errorBox" class="alert alert-danger d-none fw-semibold" role="alert"></div>
<div class="mb-3">
<label for="studentName" class="form-label fw-semibold">اسم الطالب</label>
<input type="text" id="studentName" class="form-control" placeholder="أدخل اسم الطالب ثلاثي">
</div>
<div class="row g-2 mb-3">
<div class="col-md-4">
<label for="grade1" class="form-label fw-semibold">المادة 1</label>
<input type="number" id="grade1" class="form-control" placeholder="0 - 100">
</div>
<div class="col-md-4">
<label for="grade2" class="form-label fw-semibold">المادة 2</label>
<input type="number" id="grade2" class="form-control" placeholder="0 - 100">
</div>
<div class="col-md-4">
<label for="grade3" class="form-label fw-semibold">المادة 3</label>
<input type="number" id="grade3" class="form-control" placeholder="0 - 100">
</div>
</div>
<div class="mb-4">
<label for="attendance" class="form-label fw-semibold">نسبة الحضور (%)</label>
<input type="number" id="attendance" class="form-control" placeholder="0 - 100">
</div>
<div class="d-grid gap-2">
<button id="addStudentBtn" class="btn btn-primary fw-bold py-2">
                               إضافة طالب
</button>
<button id="mercyBtn" class="btn btn-warning fw-bold py-2 text-dark">
                               تفعيل لجنة الرأفة
</button>
</div>
</div>
</div>
</div>
<!-- قسم عرض القائمة والتقرير -->
<div class="col-lg-7">
<!-- صندوق قائمة الطلاب المضافين -->
<div class="card shadow-sm border-0 rounded-3 mb-4">
<div class="card-header bg-dark text-white fw-bold py-3">
                       قائمة الطلاب المسجلين
</div>
<div class="card-body p-4">
<div id="studentsListBox" class="list-group">
<p class="text-muted text-center my-3" id="emptyMsg">لم يتم إضافة أي طلاب حتى الآن.</p>
</div>
</div>
</div>
<!-- صندوق التقرير النهائي للجنة الرأفة -->
<div class="card shadow-sm border-0 rounded-3">
<div class="card-header bg-success text-white fw-bold py-3">
                       التقرير النهائي للجنة الرأفة
</div>
<div class="card-body p-4">
<div id="mercyReportBox">
<p class="text-muted text-center my-2">اضغط على زر "تفعيل لجنة الرأفة" لعرض التقرير.</p>
</div>
</div>
</div>
</div>
</div>
</div>
<script src="js/main.js"></script>
</body>
</html>
